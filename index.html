<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matchday — Tournament Predictions</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0e1512">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Matchday">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Manrope:wght@400;500;700;800&family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
<script type="module" defer>
  import { polyfillCountryFlagEmojis } from "https://cdn.skypack.dev/country-flag-emoji-polyfill";
  polyfillCountryFlagEmojis();
</script>
<style>
/* =========================================================
   DESIGN TOKENS
   Theme: "Matchday scoreboard" — pitch-night dark by default,
   amber scoreboard-lamp accent, split-flap signature motif.
   ========================================================= */
:root{
  --bg:#0e1512; --surface:#16211c; --surface-2:#1d2a23; --surface-3:#233229;
  --border:rgba(237,239,234,.09); --border-strong:rgba(237,239,234,.18);
  --text:#edefea; --text-dim:#9aa69e; --text-faint:#6b7870;
  --amber:#ffb020; --amber-dim:#8a611c; --green:#4c9a6a; --green-dim:#2c4636;
  --red:#e2564f; --red-dim:#4a2723; --blue:#5b8fd6;
  --radius:10px; --radius-lg:16px;
  --font-en:'Twemoji Country Flags','Manrope',sans-serif; --font-he:'Twemoji Country Flags','Heebo',sans-serif; --font-mono:'Space Mono',monospace;
  --shadow: 0 8px 24px rgba(0,0,0,.35);
}
html[data-theme="light"]{
  --bg:#eef1ec; --surface:#ffffff; --surface-2:#f5f7f3; --surface-3:#e9ede6;
  --border:rgba(16,32,26,.1); --border-strong:rgba(16,32,26,.2);
  --text:#0f1c16; --text-dim:#4d5b53; --text-faint:#7c8a82;
  --amber-dim:#ffe2ad; --green-dim:#cfe6da; --red-dim:#f6d3d1;
  --shadow: 0 8px 24px rgba(16,32,26,.08);
}
*{box-sizing:border-box; margin:0; padding:0;}
body{background:var(--bg); color:var(--text); font-family:var(--font-en); transition:background .25s,color .25s;}
html[dir="rtl"] body{font-family:var(--font-he);}
.mono{font-family:var(--font-mono);}
.iso-num{unicode-bidi:isolate; direction:ltr; display:inline-block;}
a{color:inherit;}
button{font-family:inherit; cursor:pointer;}
input,select{font-family:inherit;}

/* ---------- App shell ---------- */
.app-header{
  position:sticky; top:0; z-index:50; background:var(--bg);
  border-bottom:1px solid var(--border); backdrop-filter:blur(6px);
}
.header-top{display:flex; align-items:center; justify-content:space-between; padding:12px 16px; gap:8px;}
.brand{display:flex; align-items:center; gap:8px; font-family:var(--font-mono); font-weight:700; font-size:19px; letter-spacing:.5px; flex-shrink:0; white-space:nowrap;}
html[dir="rtl"] .brand{font-family:var(--font-he); letter-spacing:normal;}
.brand .dot{width:9px; height:9px; border-radius:50%; background:var(--amber); box-shadow:0 0 8px var(--amber); flex-shrink:0;}
.header-controls{display:flex; align-items:center; gap:6px; min-width:0;}
.icon-btn{
  background:var(--surface); border:1px solid var(--border); color:var(--text);
  border-radius:8px; padding:7px 10px; font-size:13px; font-weight:600; flex-shrink:0; white-space:nowrap;
}
.icon-btn:hover{border-color:var(--border-strong);}
.icon-btn.active{background:var(--amber); color:#1a1408; border-color:var(--amber);}
.countdown-timer{font-family:var(--font-en); font-size:12px; font-weight:700; color:var(--text-dim);}
html[dir="rtl"] .countdown-timer{font-family:var(--font-he);}
.countdown-timer.urgent{color:var(--red);}
#gsi-btn-wrap{display:flex; align-items:center; min-width:0;}
.user-chip{display:flex; align-items:center; gap:6px; background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:4px 10px 4px 4px; min-width:0;}
html[dir="rtl"] .user-chip{padding:4px 4px 4px 10px;}
.user-chip img{width:24px; height:24px; border-radius:50%; flex-shrink:0;}
.user-chip .name{font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:90px;}
.user-chip .signout{font-size:15px; line-height:1; color:var(--text-faint); flex-shrink:0; padding:2px; cursor:pointer;}
@media(max-width:480px){
  .header-top{padding:10px 12px; gap:4px;}
  .brand{font-size:15px; gap:5px;}
  .brand .dot{width:7px; height:7px;}
  .header-controls{gap:4px;}
  .icon-btn{padding:6px 8px; font-size:11.5px;}
  .user-chip .name{max-width:46px; font-size:12px;}
  .user-chip{gap:4px; padding:3px 8px 3px 3px;}
  html[dir="rtl"] .user-chip{padding:3px 3px 3px 8px;}
  .user-chip img{width:20px; height:20px;}
}

.tabs{display:flex; gap:2px; padding:0 16px; overflow-x:auto; scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab-btn{
  background:none; border:none; color:var(--text-dim); font-weight:700; font-size:13.5px;
  padding:12px 16px; border-bottom:2px solid transparent; white-space:nowrap; letter-spacing:.2px;
}
.tab-btn.active{color:var(--amber); border-bottom-color:var(--amber);}
.tab-btn:hover:not(.active){color:var(--text);}

main{max-width:1080px; margin:0 auto; padding:24px 16px 80px;}
.view{display:none; animation:fadeIn .3s ease;}
.view.active{display:block;}
@keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:20px; margin-bottom:16px;}
.card-title{font-family:var(--font-mono); font-weight:700; font-size:13px; text-transform:uppercase; letter-spacing:1px; color:var(--text-faint); margin-bottom:14px;}
html[dir="rtl"] .card-title{font-family:var(--font-he); letter-spacing:normal;}
.section-title{font-size:22px; font-weight:800; margin-bottom:4px;}
.section-sub{color:var(--text-dim); font-size:14px; margin-bottom:20px;}

/* ---------- Split-flap signature element ---------- */
.flap-board{display:flex; gap:6px; flex-wrap:wrap; align-items:center; direction:ltr;}
.flap-group{display:flex; flex-direction:column; align-items:center; gap:6px;}
.flap-label{font-size:10px; text-transform:uppercase; letter-spacing:1px; color:var(--text-faint); font-weight:700;}
.flap-char{
  width:34px; height:44px; background:#10231a; border-radius:4px; position:relative; overflow:hidden;
  display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-weight:700;
  font-size:24px; color:var(--amber); box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);
}
.flap-char::after{content:""; position:absolute; left:0; right:0; top:50%; height:1px; background:rgba(0,0,0,.5);}
.flap-char.flip{animation:flip .35s ease;}
@keyframes flip{0%{transform:rotateX(0);} 50%{transform:rotateX(90deg); opacity:.4;} 100%{transform:rotateX(0); opacity:1;}}

/* ---------- Leaderboard ---------- */
.leaderboard{width:100%; border-collapse:collapse;}
.leaderboard th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:var(--text-faint); padding:8px 10px; border-bottom:1px solid var(--border); font-weight:700;}
html[dir="rtl"] .leaderboard th{text-align:right;}
.leaderboard td{padding:12px 10px; border-bottom:1px solid var(--border); font-size:14px; vertical-align:middle;}
.leaderboard tr:hover td{background:var(--surface-2);}
.rank-cell{font-family:var(--font-mono); font-weight:700; width:36px; color:var(--text-dim);}
.rank-delta{font-size:10px; font-weight:700; vertical-align:middle; unicode-bidi:isolate; direction:ltr; display:inline-block;}
.rank-delta.up{color:var(--green);} .rank-delta.down{color:var(--red);} .rank-delta.same{color:var(--text-faint);}
.rank-cell.top1{color:var(--amber);} .rank-cell.top2{color:#c9c9c9;} .rank-cell.top3{color:#c88a4d;}
.points-cell{font-family:var(--font-mono); font-weight:700; font-size:16px; color:var(--amber); text-align:right;}
.form-dots{display:flex; gap:4px;}
.form-dot{width:9px; height:9px; border-radius:50%;}
.form-dot.green{background:var(--green);} .form-dot.yellow{background:var(--amber);} .form-dot.red{background:var(--red);}
.player-name-cell{display:flex; align-items:center; gap:10px; font-weight:600;}
.avatar{width:28px; height:28px; border-radius:50%; background:var(--surface-3); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; color:var(--text-dim);}

/* ---------- Rules ---------- */
.rules-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
.rules-grid > *{min-width:0;}
@media(max-width:720px){.rules-grid{grid-template-columns:1fr;}}
.rule-table{width:100%; border-collapse:collapse; font-size:13.5px;}
.rule-table td{padding:7px 4px; border-bottom:1px solid var(--border);}
.rule-table td:last-child{text-align:right;}
.rule-value{display:inline-block; min-width:30px; text-align:center; background:var(--surface-3); color:var(--amber); font-weight:700; font-family:var(--font-mono); font-size:13px; padding:3px 9px; border-radius:6px; unicode-bidi:isolate; direction:ltr;}
.rule-value.negative{color:var(--red);}
.rule-table .pos-tag{display:inline-block; font-size:10px; font-weight:800; padding:2px 6px; border-radius:4px; background:var(--surface-3); margin-inline-end:6px;}
.badge-pos-GK{color:var(--blue);} .badge-pos-DF{color:var(--green);} .badge-pos-MF{color:var(--amber);} .badge-pos-FW{color:var(--red);}

/* ---------- Forms ---------- */
.field{margin-bottom:16px;}
.field label{display:block; font-size:12.5px; font-weight:700; color:var(--text-dim); margin-bottom:6px; text-transform:uppercase; letter-spacing:.4px;}
.field select, .field input[type=number], .field input[type=text]{
  width:100%; background:var(--surface-2); border:1px solid var(--border); color:var(--text);
  padding:10px 12px; border-radius:8px; font-size:14px;
}
.field select:focus, .field input:focus{outline:2px solid var(--amber); outline-offset:1px;}
.podium-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px;}
@media(max-width:640px){.podium-grid{grid-template-columns:1fr 1fr;}}
.group-editor{background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:12px; margin-bottom:10px;}
.group-editor h4{font-family:var(--font-mono); font-size:12px; color:var(--text-faint); margin-bottom:8px; text-transform:uppercase;}
html[dir="rtl"] .group-editor h4{font-family:var(--font-he); letter-spacing:normal;}
.groups-grid{display:flex; flex-direction:column;}
@media(min-width:860px){
  .groups-grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:10px;}
  .groups-grid .group-editor{margin-bottom:0;}
}
.drag-list{list-style:none; display:flex; flex-direction:column; gap:6px;}
.drag-item{
  background:var(--surface-3); border:1px solid var(--border); border-radius:8px; padding:9px 12px;
  display:flex; align-items:center; gap:10px; font-size:13.5px; font-weight:600; cursor:grab;
}
.drag-item.dragging{opacity:.4;}
.drag-handle{color:var(--text-faint); font-size:14px;}
.drag-pos{font-family:var(--font-mono); font-weight:700; color:var(--amber); width:16px;}
.btn{
  background:var(--amber); color:#1a1408; border:none; padding:11px 22px; border-radius:8px; font-weight:800;
  font-size:14px; letter-spacing:.3px;
}
.btn:hover{filter:brightness(1.08);}
.btn:disabled{background:var(--surface-3); color:var(--text-faint); cursor:not-allowed;}
.btn-ghost{background:transparent; border:1px solid var(--border-strong); color:var(--text);}
.lock-banner{background:var(--red-dim); border:1px solid var(--red); color:var(--text); padding:10px 14px; border-radius:8px; font-size:13.5px; margin-bottom:16px; display:flex; align-items:center; gap:8px;}
.saved-banner{background:var(--green-dim); border:1px solid var(--green); color:var(--text); padding:10px 14px; border-radius:8px; font-size:13.5px; margin-bottom:16px;}

/* ---------- Games ---------- */
.games-grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:12px;}
.games-grid > .card{grid-column:1 / -1;}
@media(max-width:720px){.games-grid{grid-template-columns:1fr;}}
.game-card{border:1px solid var(--border); border-radius:var(--radius-lg); padding:12px; margin-bottom:0; background:var(--surface);}
.game-meta{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; font-size:10.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.4px;}
.game-teams{display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:10px;}
.team-name{font-weight:800; font-size:13px; flex:1; text-align:center;}
.score-inputs{display:flex; align-items:center; gap:6px; direction:ltr;}
.score-inputs input{width:42px; text-align:center; font-family:var(--font-mono); font-size:16px; font-weight:700; background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:6px 4px; color:var(--amber);}
.score-sep{font-family:var(--font-mono); font-weight:700; color:var(--text-faint);}
.status-pill{font-size:10px; font-weight:800; padding:3px 8px; border-radius:20px; text-transform:uppercase;}
.status-scheduled{background:var(--green-dim); color:var(--green);}
.status-locked{background:var(--red-dim); color:var(--red);}
.status-final{background:var(--green-dim); color:var(--green);}
.points-pill{font-family:var(--font-mono); font-weight:700; background:var(--amber-dim); color:var(--amber); padding:3px 10px; border-radius:20px; font-size:12px;}

/* ---------- Stats ---------- */
canvas{width:100%; height:280px; display:block;}
.stats-point{cursor:pointer; transition:r .15s;}
.stats-point:hover{r:6.5;}
.stats-chart-wrap{position:relative;}
.stats-tooltip{
  position:absolute; display:none; pointer-events:none; transform:translate(-50%,-130%);
  background:var(--surface-3); border:1px solid var(--border-strong); border-radius:6px;
  padding:6px 10px; font-size:12px; font-weight:600; white-space:nowrap; z-index:10;
  box-shadow:0 4px 12px rgba(0,0,0,.25);
}
.legend{display:flex; flex-wrap:wrap; gap:12px; margin-top:12px;}
.legend-item{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--text-dim);}
.legend-swatch{width:10px; height:10px; border-radius:3px;}

/* ---------- Hall of fame ---------- */
.hof-item{display:flex; align-items:center; gap:16px; padding:14px 0; border-bottom:1px solid var(--border);}
.hof-year{font-family:var(--font-mono); font-weight:700; font-size:20px; color:var(--amber); width:64px;}
.hof-trophy{font-size:22px;}
.hof-name{font-weight:800; font-size:15px;}
.hof-sub{font-size:12.5px; color:var(--text-dim);}

.empty-state{text-align:center; padding:40px 20px; color:var(--text-faint);}
.spinner{width:22px; height:22px; border-radius:50%; border:2px solid var(--border-strong); border-top-color:var(--amber); animation:spin .7s linear infinite; margin:0 auto;}
@keyframes spin{to{transform:rotate(360deg);}}
.demo-note{font-size:11.5px; color:var(--text-faint); text-align:center; padding:10px; border-top:1px dashed var(--border); margin-top:10px;}

.md-toast{
  position:fixed; top:16px; left:50%; transform:translate(-50%,-140%);
  background:var(--green); color:#0b1a10; font-weight:800; font-size:14px;
  padding:13px 22px; border-radius:12px; box-shadow:0 10px 30px rgba(0,0,0,.35);
  z-index:200; display:flex; align-items:center; gap:8px; max-width:90vw; text-align:center;
  transition:transform .35s cubic-bezier(.34,1.56,.64,1), opacity .35s; opacity:0;
}
.md-toast.error{background:var(--red); color:#2a0d0b;}
.md-toast.show{transform:translate(-50%,0); opacity:1;}
.player-pts-red{background:var(--red-dim); color:var(--red);}
.player-pts-yellow{background:var(--amber-dim); color:var(--amber);}
.player-pts-green{background:var(--green-dim); color:var(--green);}
.subtab-row{display:flex; gap:8px; margin-bottom:16px;}
.subtab-btn{background:var(--surface); border:1px solid var(--border); color:var(--text-dim); font-weight:700; font-size:13px; padding:8px 14px; border-radius:20px;}
.subtab-btn.active{background:var(--amber); color:#1a1408; border-color:var(--amber);}
.filter-row{display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap;}
.filter-chip{background:transparent; border:1px solid var(--border); color:var(--text-dim); font-weight:600; font-size:12px; padding:6px 12px; border-radius:20px;}
.filter-chip.active{background:var(--surface-3); color:var(--text); border-color:var(--border-strong);}
.whatsapp-btn{background:#25D366; color:#07321a; border-color:#25D366;}
.whatsapp-btn:hover{filter:brightness(1.05);}

/* ---------- Badges ---------- */
.badges-cell{display:flex; gap:3px; flex-wrap:wrap; max-width:130px;}
.badge-chip-sm{display:inline-flex; align-items:center; justify-content:center; font-size:15px; cursor:default;}
.badge-chip{display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px; background:var(--surface-2); border:1px solid var(--border); margin-bottom:8px;}
.badge-chip.locked{opacity:.4; filter:grayscale(1);}
.badge-chip .badge-icon{font-size:22px; flex-shrink:0; width:30px; text-align:center;}
.badge-chip .badge-name{font-weight:800; font-size:13.5px;}
.badge-chip .badge-desc{font-size:12px; color:var(--text-dim);}

/* ---------- Profile / stat grid ---------- */
.stat-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(120px,1fr)); gap:10px;}
.stat-tile{background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:12px; text-align:center;}
.stat-tile .stat-value{font-family:var(--font-mono); font-weight:800; font-size:22px; color:var(--amber);}
.stat-tile .stat-label{font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.4px; margin-top:4px;}

/* ---------- Crowd consensus ---------- */
.consensus-row{margin-bottom:10px;}
.consensus-row-top{display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:4px; gap:8px;}
.consensus-bar-track{height:8px; border-radius:6px; background:var(--surface-3); overflow:hidden;}
.consensus-bar-fill{height:100%; background:var(--amber); border-radius:6px;}

/* ---------- Install banner ---------- */
.install-banner{
  position:fixed; left:16px; right:16px; bottom:16px; z-index:150; background:var(--surface-3);
  border:1px solid var(--border-strong); border-radius:var(--radius-lg); padding:12px 14px;
  display:none; align-items:center; gap:12px; box-shadow:var(--shadow); max-width:480px; margin:0 auto;
}
.install-banner .install-text{flex:1; font-size:13px; font-weight:600; min-width:0;}
.install-banner .install-close{background:none; border:none; color:var(--text-faint); font-size:18px; line-height:1; padding:2px 4px; flex-shrink:0;}
</style>
</head>
<body>

<header class="app-header">
  <div class="header-top">
    <div class="brand"><span class="dot"></span><span data-i18n="brandName">MATCHDAY</span></div>
    <div class="header-controls">
      <button class="icon-btn" id="langToggle">EN</button>
      <button class="icon-btn" id="timerToggle" title="Countdown timers">⏱️</button>
      <button class="icon-btn" id="themeToggle">🌙</button>
      <div id="gsi-btn-wrap"></div>
    </div>
  </div>
  <nav class="tabs" id="tabNav"></nav>
</header>

<main id="main"></main>

<div class="install-banner" id="installBanner">
  <span style="font-size:22px;">📲</span>
  <div class="install-text" id="installBannerText"></div>
  <button class="btn" id="installBannerBtn" style="padding:8px 14px; font-size:12.5px;"></button>
  <button class="install-close" id="installBannerClose" aria-label="Dismiss">✕</button>
</div>

<script>
/* =========================================================
   ============  1. CONFIG  — edit per tournament  ==========
   =========================================================
   Fill this in once per tournament. Team lists, rosters and
   scoring rules live here in code (per your choice). Games,
   bets and results live in the Google Sheet below.
*/
// Only this email sees the hidden Admin tab and can post admin actions.
// Keep in sync with Code.gs's own ADMIN_EMAIL — the real enforcement happens there.
const ADMIN_EMAIL = 'nut.cr4ck3r.pro@gmail.com';

const CONFIG = {
  // --- Apps Script Web App URL: the ONLY way this site talks to the Sheet.
  // The Sheet itself should be fully private (no "anyone with the link") —
  // the script runs as its owner and decides what each caller may see.
  // See SETUP.md. ---
  APPS_SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbzg9u__7JX1Tw-oodrqohyXP_h5jjFueewGKixkwZnz9rtAIP6rugOP376VuPYiunDb/exec',

  // --- General predictions form closes automatically at this time ---
  GENERAL_DEADLINE: '2028-06-09T00:00:00+03:00',

  // Does this tournament have an official 3rd-place match? (World Cup: yes. Euro: no.)
  // When false, the Rules page hides the exact-position bonus for positions 3/4
  // (there's no official decider between the two losing semifinalists), and
  // Code.gs won't award it either. Keep this in sync with Code.gs's own copy.
  HAS_THIRD_PLACE_MATCH: false,

let LANG = localStorage.getItem('md_lang') || 'en';
let SHOW_TIMER = localStorage.getItem('md_showTimer') === '1';
function formatCountdown(ms){
  if(ms<=0) return t('timerClosedShort');
  const totalSec = Math.floor(ms/1000);
  const days = Math.floor(totalSec/86400);
  const hours = Math.floor((totalSec%86400)/3600);
  const mins = Math.floor((totalSec%3600)/60);
  const secs = totalSec%60;
  const pad = n => String(n).padStart(2,'0');
  const clock = `<span class="iso-num">${pad(hours)}:${pad(mins)}:${pad(secs)}</span>`;
  if(days<=0) return clock;
  return LANG==='he'
    ? `${days} ${t('timerDaysWord')} ו-${clock} ${t('timerHoursWord')}`
    : `${days}${t('timerDaysShort')} ${clock}`;
}
function tickCountdowns(){
  document.querySelectorAll('.countdown-timer').forEach(el => {
    const diff = new Date(el.dataset.until) - new Date();
    el.innerHTML = formatCountdown(diff);
    el.classList.toggle('urgent', diff>0 && diff < 3600000);
  });
}
setInterval(tickCountdowns, 1000);
function t(key,...args){ const v = I18N[LANG][key]; return typeof v==='function' ? v(...args) : v; }

/* =========================================================
   ============  2b. Bilingual display-name helpers  =========
   Everything stored in the Sheet (teams, players, results) is
   an ID or an explicit _en/_he pair — never plain display text —
   so the whole site re-renders correctly in either language
   without touching stored data.
   ========================================================= */
function teamName(teamId){
  const t = CONFIG.TEAMS[teamId];
  if(!t) return teamId;
  const label = t[LANG] || t.en || teamId;
  // Isolate the flag as its own LTR run — some flags (e.g. England/Scotland's
  // tag-sequence flags) otherwise get bidi-reordered to the wrong side in RTL.
  return t.flag ? `\u2066${t.flag}\u2069 ${label}` : label;
}

async function fetchTab(tabName, timeoutMs=12000){
  if(STATE.user && isIdTokenExpired(STATE.user.idToken)) clearExpiredSession();
  const idToken = STATE.user ? STATE.user.idToken : '';
  const url = `${CONFIG.APPS_SCRIPT_URL}?tab=${encodeURIComponent(tabName)}&idToken=${encodeURIComponent(idToken)}`;
  // Apps Script's redirect-to-content-key hop can occasionally hang/404 for many
  // seconds instead of failing fast — bail out early so callers can fall back.
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);
  try{
    const res = await fetch(url, { signal: controller.signal });
    return await res.json();
  } finally {
    clearTimeout(timer);
  }
}
async function postBet(payload){
  // Apps Script web app handles auth + writes + server-side lock checks. See Code.gs
  // idToken lets Code.gs verify the caller's real identity instead of trusting email/adminEmail.
  const withAuth = { ...payload, idToken: STATE.user ? STATE.user.idToken : '' };
  return fetch(CONFIG.APPS_SCRIPT_URL, {
    method:'POST', mode:'no-cors', // no-cors: Apps Script doGet/doPost redirect responses aren't readable cross-origin
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(withAuth)
  });
}

// Rapid tab-switching used to fire a new loadAllData() on top of one already
// in flight, piling up concurrent Apps Script executions until some started
// failing — this de-dupes so overlapping calls just await the same request.
let loadAllDataPromise = null;
function loadAllData(){
  if(loadAllDataPromise) return loadAllDataPromise;
  loadAllDataPromise = loadAllDataImpl().finally(() => { loadAllDataPromise = null; });
  return loadAllDataPromise;
}
async function loadAllDataImpl(){
  // A background resync (e.g. from switching tabs) failing shouldn't nuke an
  // already-working session into fake demo data — only fall back on the very
  // first load, when there's no real data on screen yet to preserve.
  const hadRealData = STATE.loaded && !STATE.demo && STATE.participants.length > 0;
  try{
    // Single request/single Apps Script execution for everything — firing 7
    // separate ones in parallel (one per tab) let Apps Script serialize them
    // against the same Sheet, so the last ones could queue behind all the
    // others (each also independently re-verifying the same idToken).
    let data = null;
    try{ data = await fetchTab('all'); }catch(_e){ /* falls through to the per-tab fetch below */ }
    if(!data || data.error || !Array.isArray(data.participants)){
      // Backend not yet redeployed with the "all" route (or some other hiccup
      // with it) — fall back to the old per-tab requests instead of giving up
      // and showing demo data.
      const [participants, games, gameBets, generalBets, hof, gameEvents, groupResults] = await Promise.all([
        fetchTab('Participants'), fetchTab('Games'), fetchTab('GameBets'), fetchTab('GeneralBets'),
        fetchTab('HallOfFame'), fetchTab('GameEvents'), fetchTab('GroupResults'),
      ]);
      data = { participants, games, gameBets, generalBets, hof, gameEvents, groupResults };
    }
    const { participants, games, gameBets, generalBets, hof, gameEvents, groupResults } = data;
    if(!Array.isArray(participants) || (!participants.length && !games.length)) throw new Error('empty sheet / not configured');
    Object.assign(STATE, { participants, games, gameBets, generalBets, hof, gameEvents, groupResults, demo:false });
  }catch(e){
    if(hadRealData) return;
    if(!CONFIG.DEMO_MODE_FALLBACK) throw e;
    Object.assign(STATE, demoData());
    STATE.demo = true;
  }
  STATE.loaded = true;
}

/* =========================================================
   ============  5. Scoring helpers (client-side, read-only
   display — authoritative calc happens in Apps Script) =====
   ========================================================= */
function computeGameScore(betA, betB, actualA, actualB){
  if(actualA==='' || actualA==null || actualB==='' || actualB==null) return null;
  betA=+betA; betB=+betB; actualA=+actualA; actualB=+actualB;
  let pts = 0;
  const s = CONFIG.SCORING.game;
  const outcome = (a,b) => a>b?'W':a<b?'L':'D';
  if(outcome(betA,betB) === outcome(actualA,actualB)) pts += s.outcome;
  if((betA-betB) === (actualA-actualB)) pts += s.diff;
  if(betA===actualA && betB===actualB) pts += s.exact;
  return pts;
}

function showToast(message, isError){

  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => { toast.classList.remove('show'); }, isError ? 4500 : 2600);

/** Re-fetches ONE tab a few times, spaced out, since Apps Script can take a
 *  few seconds (cold start) to actually commit a write. Merges the fresh
 *  rows into STATE[stateKey] each time. Returns true as soon as checkFn()
 *  finds the just-saved data, false if it never shows up in time. */
async function pollUntilSaved(tabName, stateKey, checkFn, attempts=5, delayMs=1500, reapplyOptimistic){
  for(let i=0; i<attempts; i++){
    await new Promise(r => setTimeout(r, delayMs));
    try{
      const rows = await fetchTab(tabName);
      // The sheet read can lag behind the write that was just submitted (Apps
      // Script cold starts, etc.), so re-apply our own optimistic row on top —
      // otherwise this refresh can transiently wipe out the very change we're
      // still confirming (e.g. the "double points" flag) before the next render.
      if(Array.isArray(rows)){ STATE[stateKey] = rows; if(reapplyOptimistic) reapplyOptimistic(); }
    }catch(e){ /* transient network hiccup — just try again next loop */ }
    if(checkFn()) return true;
  }
  return false;
}

function rankedParticipants(){
  const sorted = [...STATE.participants]
    .map(p => ({...p, displayName: participantName(p), totalPoints:+p.totalPoints || 0, exactPct:+p.exactPct || 0, form: safeParse(p.form, [])}))
    .sort((a,b) => b.totalPoints - a.totalPoints || b.exactPct - a.exactPct);
  let rank = 0, prevKey = null;
  const ranked = sorted.map((p,i) => {
    const key = p.totalPoints + '|' + p.exactPct;
    if(key !== prevKey){ rank = i+1; prevKey = key; }
    return {...p, rank};
  });

  // Previous standing = total points minus the most recent tracked game, so we
  // can show whether each participant moved up/down since their last game.
  const withPrevPoints = ranked.map(p => {
    const hasHistory = p.form.length > 0;
    const lastGamePts = hasHistory ? p.form[p.form.length-1] : 0;
    return { ...p, prevPoints: p.totalPoints - lastGamePts, hasHistory };
  });
  const prevSorted = [...withPrevPoints].sort((a,b) => b.prevPoints - a.prevPoints);
  let prevRank = 0, prevKey2 = null;
  const prevRankMap = {};
  prevSorted.forEach((p,i) => {
    if(p.prevPoints !== prevKey2){ prevRank = i+1; prevKey2 = p.prevPoints; }
    prevRankMap[p.email] = prevRank;
  });
  return withPrevPoints.map(p => {
    if(!p.hasHistory) return { ...p, rankDelta: null };
    return { ...p, rankDelta: prevRankMap[p.email] - p.rank }; // positive = moved up
  });
}
function safeParse(s, fallback){ try{ return typeof s==='string' ? JSON.parse(s) : (s||fallback); }catch{ return fallback; } }

const BADGES = [

    desc:{en:'The biggest rank jump since the last game', he:'הקפיצה הגדולה ביותר בדירוג מאז המשחק האחרון'}, check:s => s.isTopClimber },
];
/** One participant's raw stats, derived from STATE — used both to decide
 *  which badges they've earned and to power the Profile page's stat grid. */
function computeParticipantStats(email, ranked){
  const norm = normEmail(email);
  const myGameBets = STATE.gameBets.filter(b => normEmail(b.email)===norm && b.betA!==undefined && b.betA!=='' && b.betA!=null);
  let exactCount=0, outcomeCount=0, topPlayerHits=0, advancingHits=0, doublePaidOff=false;
  myGameBets.forEach(b => {
    const game = STATE.games.find(g => String(g.id)===String(b.gameId));
    if(!game || String(game.status).trim()!=='final' || game.scoreA==null || game.scoreA==='') return;
    const betA=+b.betA, betB=+b.betB, actualA=+game.scoreA, actualB=+game.scoreB;
    if(betA===actualA && betB===actualB) exactCount++;
    const outcome = (a,c) => a>c?'W':a<c?'L':'D';
    if(outcome(betA,betB)===outcome(actualA,actualB)) outcomeCount++;
    if(b.betTopPlayer){
      const events = STATE.gameEvents.filter(ev => String(ev.gameId)===String(game.id) && ev.player===b.betTopPlayer);
      if(events.length && computePlayerGamePoints(events) > 0) topPlayerHits++;
    }
    if(isKnockout(game) && b.betAdvancing && game.advancingTeam && String(b.betAdvancing)===String(game.advancingTeam)) advancingHits++;
    if(isDoubleFlag(b.betDouble) && b.pointsEarned!=='' && b.pointsEarned!=null && +b.pointsEarned>0) doublePaidOff = true;
  });
  const rankedEntry = ranked.find(p => normEmail(p.email)===norm);
  const participantRow = STATE.participants.find(p => normEmail(p.email)===norm);
  return {
    gamesBet: myGameBets.length, exactCount, outcomeCount, topPlayerHits, advancingHits, doublePaidOff,
    rank: rankedEntry ? rankedEntry.rank : null, rankDelta: rankedEntry ? rankedEntry.rankDelta : null,
    generalPoints: +((participantRow||{}).generalPoints) || 0,
  };
}
/** Stats + earned badges for every participant, computed once per render.
 *  Returns { statsByEmail, badgesByEmail } keyed by normalized email. */
function computeAllParticipantBadges(){
  const ranked = rankedParticipants();
  const statsByEmail = {};
  ranked.forEach(p => { statsByEmail[normEmail(p.email)] = computeParticipantStats(p.email, ranked); });
  const allStats = Object.values(statsByEmail);
  const maxGeneral = Math.max(0, ...allStats.map(s => s.generalPoints));
  const maxRankDelta = Math.max(0, ...allStats.map(s => s.rankDelta || 0));
  allStats.forEach(s => {
    s.isTopGeneral = maxGeneral > 0 && s.generalPoints === maxGeneral;
    s.isTopClimber = maxRankDelta > 0 && s.rankDelta === maxRankDelta;
  });
  const badgesByEmail = {};
  Object.entries(statsByEmail).forEach(([email,s]) => { badgesByEmail[email] = BADGES.filter(b => b.check(s)); });
  return { statsByEmail, badgesByEmail };
}

/** Captures `targetId`'s DOM exactly as rendered and shares/downloads it as
 *  a PNG. Elements marked data-export-exclude (buttons etc.) are omitted. */
async function exportElementImage(targetId, filename, btn){
  const target = document.getElementById(targetId);
  if(!target || !window.html2canvas) return;
  const originalText = btn ? btn.textContent : null;
  if(btn){ btn.textContent = '…'; btn.disabled = true; }
  try{
    const canvas = await html2canvas(target, {
      backgroundColor: getComputedStyle(document.documentElement).getPropertyValue('--surface').trim(),
      scale: 2,
      ignoreElements: el => el.hasAttribute && el.hasAttribute('data-export-exclude'),
    });
    canvas.toBlob(async blob => {
      const file = new File([blob], filename, { type:'image/png' });
      if(navigator.canShare && navigator.canShare({ files:[file] })){
        try{ await navigator.share({ files:[file], title:'Matchday' }); if(btn){ btn.textContent = originalText; btn.disabled = false; } return; }catch(e){ /* cancelled/unsupported, fall through to download */ }
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = filename; a.click();
      URL.revokeObjectURL(url);
      if(btn){ btn.textContent = originalText; btn.disabled = false; }
    });
  }catch(e){ if(btn){ btn.textContent = originalText; btn.disabled = false; } }
}
async function exportLeaderboardImage(){
  await exportElementImage('exportCapture', 'matchday-leaderboard.png', document.getElementById('exportImgBtn'));

function medal(rank){ return rank===1?'🥇 ':rank===2?'🥈 ':rank===3?'🥉 ':''; }
function rankDeltaBadge(delta){
  if(delta === null || delta === undefined) return '';
  if(delta > 0) return `<span class="rank-delta up" title="${t('movedUp')}">▲${delta>1?delta:''}</span>`;
  if(delta < 0) return `<span class="rank-delta down" title="${t('movedDown')}">▼${-delta>1?-delta:''}</span>`;
  return `<span class="rank-delta same" title="${t('noChange')}">▬</span>`;
}

let teamsSelectedTeam = null;
let h2hMode = false;
let h2hTeamA = null;
let h2hTeamB = null;
function playerSeasonStats(playerId){
  const stats = { goal:0, assist:0, redCard:0, cleanSheet:0, penaltySave:0, ownGoal:0, missedPenalty:0 };
  STATE.gameEvents.filter(ev => ev.player === playerId).forEach(ev => {
    const n = +ev.count || 1;
    if(stats.hasOwnProperty(ev.eventType)) stats[ev.eventType] += n;
  });
  return stats;
}
/** A player's total accumulated points across every game this tournament,
 *  using the same position-based rates as the live scoring engine. */
function computePlayerTotalPoints(playerId, pos){
  const s = playerSeasonStats(playerId), sp = CONFIG.SCORING.player;
  let pts = (sp.goal[pos]||0)*s.goal + (sp.assist[pos]||0)*s.assist
    + sp.redCard*s.redCard + sp.ownGoal*s.ownGoal + sp.missedPenalty*s.missedPenalty;
  if(pos==='GK') pts += sp.cleanSheetGK*s.cleanSheet + sp.penaltySave*s.penaltySave;
  return pts;
}
let teamsSortState = {}; // teamId -> {key, dir} — dir: 1 ascending, -1 descending
function sortRoster(teamId, roster){
  const state = teamsSortState[teamId];
  if(!state) return roster;
  const getVal = p => {
    if(state.key === 'name') return playerName(p);
    if(state.key === 'pos') return p.pos;
    if(state.key === 'points') return computePlayerTotalPoints(p.id, p.pos);
    return playerSeasonStats(p.id)[state.key] ?? 0;
  };
  return [...roster].sort((a,b) => {
    const va = getVal(a), vb = getVal(b);
    if(typeof va === 'string') return state.dir * va.localeCompare(vb, LANG==='he'?'he':'en');
    return state.dir * (va - vb);
  });
}

  const stickyBase = `position:sticky; ${LANG==='he'?'right':'left'}:0; background:var(--surface); z-index:1;`;
  const state = teamsSortState[teamId];
  const arrow = key => state && state.key===key ? (state.dir===1 ? ' ▲' : ' ▼') : '';
  const th = (key, label, extraStyle='') => `<th data-sort-key="${key}" data-sort-team="${teamId}" style="cursor:pointer; user-select:none; white-space:nowrap; ${extraStyle}">${label}${arrow(key)}</th>`;

  <div class="card">

    ${roster.length ? `
    <div style="overflow-x:auto;">
      <table class="leaderboard" style="min-width:720px;">
        <thead><tr>
          ${th('name', t('player'), stickyBase)}
          ${th('pos', t('posHeader'))}
          ${th('goal', t('evGoal'))}
          ${th('assist', t('evAssist'))}
          ${th('redCard', t('evRedCard'))}
          ${th('cleanSheet', t('evCleanSheet'))}
          ${th('penaltySave', t('evPenaltySave'))}
          ${th('ownGoal', t('evOwnGoal'))}

          ${roster.map(p => {
            const s = playerSeasonStats(p.id);
            const gkOnly = v => p.pos==='GK' ? `<span class="iso-num">${v}</span>` : '—';
            const pts = computePlayerTotalPoints(p.id, p.pos);
            return `<tr>
              <td style="${stickyBase} font-weight:700;">${playerName(p)}</td>
              <td><span class="pos-tag badge-pos-${p.pos}">${p.pos}</span></td>
              <td><span class="iso-num">${s.goal}</span></td>
              <td><span class="iso-num">${s.assist}</span></td>
              <td><span class="iso-num">${s.redCard}</span></td>
              <td>${gkOnly(s.cleanSheet)}</td>
              <td>${gkOnly(s.penaltySave)}</td>
              <td><span class="iso-num">${s.ownGoal}</span></td>
              <td><span class="iso-num">${s.missedPenalty}</span></td>
              <td class="points-cell"><span class="iso-num">${pts}</span></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>` : `<div class="empty-state" style="padding:16px;">${t('noRosterYet')}</div>`}
  </div>`;
}
function renderTeams(){

function wireTeams(){
  const h2hBtn = document.getElementById('h2hToggleBtn');

  if(teamSelect) teamSelect.addEventListener('change', () => { teamsSelectedTeam = teamSelect.value; renderAll(); });
  document.querySelectorAll('[data-h2h]').forEach(sel => {
    sel.addEventListener('change', () => {
      if(sel.dataset.h2h === 'A') h2hTeamA = sel.value; else h2hTeamB = sel.value;
      renderAll();
    });
  });
  document.querySelectorAll('[data-sort-key]').forEach(th => {
    th.addEventListener('click', () => {
      const key = th.dataset.sortKey, teamId = th.dataset.sortTeam;
      const current = teamsSortState[teamId];
      teamsSortState[teamId] = (current && current.key === key) ? { key, dir: -current.dir } : { key, dir: 1 };
      renderAll();
    });
  });

function adminRosterOptions(gameId, selectedId){
  const g = STATE.games.find(gm => String(gm.id) === String(gameId));
  if(!g) return '';
  // Alphabetical (by displayed team name) so the team order is stable and predictable, not fixture-order.
  const teamIds = [g.teamA, g.teamB].sort((a,b) => {
    const na = CONFIG.TEAMS[a][LANG] || CONFIG.TEAMS[a].en || a;
    const nb = CONFIG.TEAMS[b][LANG] || CONFIG.TEAMS[b].en || b;
    return na.localeCompare(nb, LANG==='he' ? 'he' : 'en');
  });
  return teamIds.map(teamId => {
    const options = (CONFIG.ROSTERS[teamId]||[]).map(p =>
      `<option value="${p.id}" data-team="${teamId}" data-pos="${p.pos}" ${selectedId && String(selectedId)===String(p.id)?'selected':''}>${playerName(p)} (${p.pos})</option>`
    ).join('');
    return `<optgroup label="${teamNameNoFlag(teamId)}">${options}</optgroup>`;
  }).join('');
}

function wireAdmin(){
  const resultGameSelect = document.getElementById('adminResultGame');
  const advancingField = document.getElementById('adminAdvancingField');
  const advancingSelect = document.getElementById('adminAdvancingSelect');
  const scoreALabel = document.getElementById('adminScoreALabel');
  const scoreBLabel = document.getElementById('adminScoreBLabel');
  const advancingFlag = document.querySelector('[data-flag-for="adminAdvancingSelect"]');

    const g = STATE.games.find(gm => String(gm.id) === String(resultGameSelect.value));
    scoreALabel.innerHTML = t('adminScoreFor', g ? teamFlagAndName(g.teamA) : '');
    scoreBLabel.innerHTML = t('adminScoreFor', g ? teamFlagAndName(g.teamB) : '');

    advancingField.style.display = knockout ? '' : 'none';
    advancingSelect.innerHTML = `<option value="">${t('choose')}</option>` +
      (knockout ? [g.teamA, g.teamB].map(id => `<option value="${id}">${teamNameOrTBDNoFlag(id)}</option>`).join('') : '');
    if(advancingFlag) advancingFlag.innerHTML = '';
  };
  if(resultGameSelect){ refreshAdvancingVisibility(); resultGameSelect.addEventListener('change', refreshAdvancingVisibility); }
  if(advancingSelect && advancingFlag) advancingSelect.addEventListener('change', () => { advancingFlag.innerHTML = flagBadgeHTML(advancingSelect.value); });

  const eventGameSelect = document.getElementById('adminEventGame');
  const eventPlayerSelect = document.getElementById('adminEventPlayer');
  const eventPlayerFlag = document.querySelector('[data-flag-for="adminEventPlayer"]');
  const refreshEventPlayerFlag = () => {
    const opt = eventPlayerSelect.selectedOptions[0];
    if(eventPlayerFlag) eventPlayerFlag.innerHTML = opt ? flagBadgeHTML(opt.dataset.team) : '';
  };
  const refreshPlayers = () => { eventPlayerSelect.innerHTML = adminRosterOptions(eventGameSelect.value); refreshEventPlayerFlag(); };
  if(eventGameSelect){ refreshPlayers(); eventGameSelect.addEventListener('change', refreshPlayers); }
  if(eventPlayerSelect){ eventPlayerSelect.addEventListener('change', refreshEventPlayerFlag); }

  const viewEventsSelect = document.getElementById('adminViewEventsGame');
  const eventsListEl = document.getElementById('adminEventsList');
  const wireEventDeleteButtons = () => {
    eventsListEl.querySelectorAll('[data-role="adminDeleteEvent"]').forEach(delBtn => {
      delBtn.addEventListener('click', async () => {
        if(!requireFreshSession()){ showToast('⚠️ ' + t('sessionExpired'), true); renderAll(); return; }
        if(!confirm(t('adminConfirmDeleteEvent'))) return;
        delBtn.disabled = true; delBtn.textContent = '⏳';
        await postBet({ type:'adminDeleteEvent', adminEmail: STATE.user.email, gameId: delBtn.dataset.game, rowIndex: delBtn.dataset.row });
        await new Promise(r => setTimeout(r, 1000));
        await loadAllData();
        showToast('✅ ' + t('adminEventDeleted'));
        renderAll();
      });
    });
  };
  if(viewEventsSelect){
    wireEventDeleteButtons();
    viewEventsSelect.addEventListener('change', () => {
      adminEventsSelectedGame = viewEventsSelect.value;
      eventsListEl.innerHTML = adminEventsListHTML(adminEventsSelectedGame);
      wireEventDeleteButtons();
    });
  }

  document.getElementById('adminResultForm').addEventListener('submit', async e => {
    e.preventDefault();
    if(!requireFreshSession()){ showToast('⚠️ ' + t('sessionExpired'), true); renderAll(); return; }
    const fd = new FormData(e.target);
    const msg = document.getElementById('adminResultMsg');
    msg.style.color = 'var(--text-dim)'; msg.textContent = t('saving');
    const payload = {
      type:'adminSetResult', adminEmail: STATE.user.email, gameId: fd.get('gameId'),
      scoreA: fd.get('scoreA'), scoreB: fd.get('scoreB'), status:'final',
      advancingTeam: fd.get('advancingTeam') || '',
    };
    await postBet(payload);
    await loadAllData();
    const updated = STATE.games.find(g => String(g.id)===String(payload.gameId));
    if(updated && String(updated.scoreA)===String(payload.scoreA) && String(updated.status).trim()==='final'){
      msg.style.color = 'var(--green)'; msg.textContent = t('saved'); showToast('✅ ' + t('saved'));
    } else {
      msg.style.color = 'var(--red)'; msg.textContent = t('saveFailed'); showToast('⚠️ ' + t('saveFailed'), true);
    }
    renderAll();
  });

  document.getElementById('adminEventForm').addEventListener('submit', async e => {
    e.preventDefault();
    if(!requireFreshSession()){ showToast('⚠️ ' + t('sessionExpired'), true); renderAll(); return; }
    const fd = new FormData(e.target);
    const opt = eventPlayerSelect.selectedOptions[0];
    const msg = document.getElementById('adminEventMsg');
    msg.style.color = 'var(--text-dim)'; msg.textContent = t('saving');
    const payload = {
      type:'adminAddEvent', adminEmail: STATE.user.email, gameId: fd.get('gameId'),
      player: fd.get('playerId'), team: opt ? opt.dataset.team : '', position: opt ? opt.dataset.pos : '',
      eventType: fd.get('eventType'), count: fd.get('count') || 1,
    };
    await postBet(payload);
    await new Promise(r => setTimeout(r, 1200));
    await loadAllData();
    msg.style.color = 'var(--green)'; msg.textContent = t('saved'); showToast('✅ ' + t('saved'));
    renderAll();
  });

  document.getElementById('adminRecalcBtn').addEventListener('click', async function(){
    if(!requireFreshSession()){ showToast('⚠️ ' + t('sessionExpired'), true); renderAll(); return; }
    const btn = this;
    const msg = document.getElementById('adminRecalcMsg');
    btn.disabled = true;
    msg.style.color = 'var(--text-dim)'; msg.textContent = '⏳ ' + t('adminRecalculating');
    await postBet({ type:'adminRecalculate', adminEmail: STATE.user.email });
    await new Promise(r => setTimeout(r, 2000)); // recalculation can take a moment across many rows
    await loadAllData();
    msg.style.color = 'var(--green)'; msg.textContent = t('adminRecalcDone');
    showToast('✅ ' + t('adminRecalcDone'));
    renderAll();
  });
}

/** Generic "what did most people pick" tally: counts each non-empty key from
 *  keyFn across `items`, returns the top `limit` entries with their share. */
function consensusTopEntries(items, keyFn, limit){
  const counts = {};
  let total = 0;
  items.forEach(it => { const k = keyFn(it); if(k==null || k==='') return; counts[k]=(counts[k]||0)+1; total++; });
  return { total, top: Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,limit).map(([key,n])=>({key,n,pct: total?Math.round(n/total*100):0})) };
}
/** Crowd consensus for General predictions: most-picked team per podium
 *  position, and top-3 most-picked top scorer/assister — shown once revealed. */
function renderGeneralConsensus(revealedBets){

    const { top } = consensusTopEntries(revealedBets, b => b['rank'+n], 1);
    return { label: t('rank'+n), pick: top[0] };

  const scorerC = consensusTopEntries(revealedBets, b => b.topScorer, 3);

  <div class="card">

      ${podiumRows.map(r => `<div class="stat-tile">
        <div style="font-size:13px; font-weight:700;">${r.pick ? teamNameHTML(r.pick.key) : '—'}</div>
        <div class="stat-label">${r.label}${r.pick ? ` · <span class="iso-num">${r.pick.pct}%</span>` : ''}</div>
      </div>`).join('')}
    </div>
  </div>
  <div class="rules-grid" style="margin-top:12px;">
    <div class="card">
      <div class="card-title">${t('consensusTopScorerTitle')}</div>
      ${scorerC.top.length ? scorerC.top.map(consensusBar).join('') : `<div class="empty-state" style="padding:14px;">${t('noConsensusYet')}</div>`}
    </div>
    <div class="card">
      <div class="card-title">${t('consensusTopAssistTitle')}</div>
      ${assistC.top.length ? assistC.top.map(consensusBar).join('') : `<div class="empty-state" style="padding:14px;">${t('noConsensusYet')}</div>`}
    </div>
  </div>`;

function wireGeneralForm(){
  if(isGeneralLocked() || !STATE.user) return;
  document.querySelectorAll('select[data-role="teamSelect"]').forEach(sel => {
    sel.addEventListener('change', () => {
      const badge = document.querySelector(`[data-flag-for="${sel.name}"]`);
      if(badge) badge.innerHTML = flagBadgeHTML(sel.value);
    });
  });
  document.querySelectorAll('select[data-role="playerSelect"]').forEach(sel => {
    sel.addEventListener('change', () => {
      const badge = document.querySelector(`[data-flag-for="${sel.name}"]`);
      const opt = sel.selectedOptions[0];
      if(badge) badge.innerHTML = opt ? flagBadgeHTML(opt.dataset.team) : '';
    });
  });
  document.querySelectorAll('.drag-list').forEach(list => {
    let dragEl = null;
    list.querySelectorAll('.drag-item').forEach(item => {
      item.addEventListener('dragstart', () => { dragEl = item; item.classList.add('dragging'); });
      item.addEventListener('dragend', () => { item.classList.remove('dragging'); renumberGroup(list); });
    });
    list.addEventListener('dragover', e => {
      e.preventDefault();
      const after = [...list.querySelectorAll('.drag-item:not(.dragging)')].find(el => e.clientY < el.getBoundingClientRect().top + el.offsetHeight/2);
      if(after) list.insertBefore(dragEl, after); else list.appendChild(dragEl);
    });
  });
  document.getElementById('generalForm').addEventListener('submit', async e => {
    e.preventDefault();
    if(!requireFreshSession()){ showToast('⚠️ ' + t('sessionExpired'), true); renderAll(); return; }
    const fd = new FormData(e.target);
    const groupsJSON = {};
    document.querySelectorAll('.drag-list').forEach(list => {
      groupsJSON[list.dataset.group] = [...list.querySelectorAll('.drag-item')].map(li => li.dataset.team);
    });
    const payload = {
      type:'generalBet', email: STATE.user.email,
      nameEn: fd.get('nameEn'), nameHe: fd.get('nameHe'),
      rank1: fd.get('rank1'), rank2: fd.get('rank2'), rank3: fd.get('rank3'), rank4: fd.get('rank4'),
      topScorer: fd.get('topScorer'), topAssist: fd.get('topAssist'),
      groupsJSON: JSON.stringify(groupsJSON), timestamp: new Date().toISOString(),
    };
    const msg = document.getElementById('generalMsg');
    const saveBtn = document.getElementById('generalSaveBtn');
    msg.style.color = 'var(--text-dim)'; msg.textContent = t('saving'); saveBtn.disabled = true;
    await postBet(payload);
    // Optimistic: assume the write succeeded (it almost always does) and update
    // the UI immediately instead of waiting on a verification round-trip.
    const optimisticRow = { email: STATE.user.email, ...payload };
    const applyOptimisticGeneralBet = () => {
      const idx = STATE.generalBets.findIndex(b => normEmail(b.email)===normEmail(STATE.user.email));
      if(idx>=0) STATE.generalBets[idx] = {...STATE.generalBets[idx], ...optimisticRow};
      else STATE.generalBets.push(optimisticRow);
      const pIdx = STATE.participants.findIndex(p => normEmail(p.email)===normEmail(STATE.user.email));
      if(pIdx>=0) STATE.participants[pIdx] = {...STATE.participants[pIdx], name_en: payload.nameEn, name_he: payload.nameHe};
      else STATE.participants.push({ email: STATE.user.email, name_en: payload.nameEn, name_he: payload.nameHe, totalPoints:0, generalPoints:0, form:'[]', exactPct:0 });
    };
    applyOptimisticGeneralBet();
    showToast('✅ ' + t('saved'));
    renderAll();
    // Quietly confirm in the background; only surface anything if it actually failed.
    pollUntilSaved('GeneralBets', 'generalBets', () =>
      STATE.generalBets.find(b => normEmail(b.email)===normEmail(STATE.user.email) && b.rank1===payload.rank1 && b.topScorer===payload.topScorer),
      4, 1200, applyOptimisticGeneralBet
    ).then(landed => {
      if(!landed){ showToast('⚠️ ' + t('saveFailed'), true); loadAllData().then(renderAll); }
    });
  });
}
/** Snapshot of in-progress (unsaved) General-form edits — field values plus each
 *  group's drag-reordered team order — taken right before a background re-render. */
function captureGeneralFormState(){
  const form = document.getElementById('generalForm');
  if(!form) return null;
  const values = {};
  form.querySelectorAll('input[name], select[name]').forEach(el => { values[el.name] = el.value; });
  const groups = {};
  form.querySelectorAll('.drag-list[data-group]').forEach(list => {
    groups[list.dataset.group] = Array.from(list.querySelectorAll('.drag-item')).map(li => li.dataset.team);
  });
  return { values, groups };
}
/** Reapplies a captureGeneralFormState() snapshot onto a freshly re-rendered form. */
function restoreGeneralFormState(snapshot){
  if(!snapshot) return;
  const form = document.getElementById('generalForm');
  if(!form) return;
  Object.entries(snapshot.values).forEach(([name, value]) => {
    const el = form.querySelector(`[name="${name}"]`);
    if(!el || el.value === value) return;
    el.value = value;
    el.dispatchEvent(new Event('change')); // keeps the adjacent flag badge in sync
  });
  Object.entries(snapshot.groups).forEach(([g, order]) => {
    const list = form.querySelector(`.drag-list[data-group="${g}"]`);
    if(!list || !order.length) return;
    order.forEach(teamId => {
      const li = list.querySelector(`[data-team="${teamId}"]`);
      if(li) list.appendChild(li);
    });
    renumberGroup(list);
  });
}

function gameBucket(g, now){
  if(g.status === 'final') return 'played';
  if(isKnockout(g)) return 'closed'; // playoff fixtures are never open for score betting — teams may not be decided yet
  if(g.status === 'scheduled' && now <= new Date(g.kickoffISO)) return 'open';
  return 'closed'; // betting window closed (kickoff passed, or status changed) but no result recorded yet
}

  if(bucket === 'open') return renderGameCard(g);

/** Aggregates GameEvents by player for one game — only players who actually
 *  have events recorded (not the full rosters), points summed if a player
 *  appears in more than one event row. */
function playedGameMatchEvents(gameId){
  const events = STATE.gameEvents.filter(ev => String(ev.gameId) === String(gameId));
  const byPlayer = {};
  events.forEach(ev => {
    const key = ev.player;
    if(!byPlayer[key]) byPlayer[key] = { player: ev.player, team: ev.team, position: ev.position, events: [] };
    byPlayer[key].events.push(ev);
  });
  return Object.values(byPlayer)
    .map(p => ({ ...p, points: computePlayerGamePoints(p.events) }))
    .sort((a,b) => b.points - a.points);
}
function computePlayerGamePoints(events){
  const sp = CONFIG.SCORING.player;
  let pts = 0;
  events.forEach(ev => {
    const n = +ev.count || 1, pos = ev.position;
    if(ev.eventType === 'goal') pts += (sp.goal[pos]||0) * n;
    else if(ev.eventType === 'assist') pts += (sp.assist[pos]||0) * n;
    else if(ev.eventType === 'ownGoal') pts += sp.ownGoal * n;
    else if(ev.eventType === 'redCard') pts += sp.redCard * n;
    else if(ev.eventType === 'missedPenalty') pts += sp.missedPenalty * n;
    else if(ev.eventType === 'cleanSheet' && pos === 'GK') pts += sp.cleanSheetGK * n;
    else if(ev.eventType === 'penaltySave' && pos === 'GK') pts += sp.penaltySave * n;
  });
  return pts;
}
function playerPtsColor(pts){ return pts<=0 ? 'red' : pts<5 ? 'yellow' : 'green'; }

/** Builds a plain SVG pie chart (no external deps, captures cleanly in
 *  exported images) from [{value, color}, ...]. */
function svgPieChart(segments, size){
  const total = segments.reduce((a,s) => a+s.value, 0);
  const cx = size/2, cy = size/2, r = size/2 - 2;
  if(total <= 0) return `<svg viewBox="0 0 ${size} ${size}" style="width:${size}px; height:${size}px; flex-shrink:0;"><circle cx="${cx}" cy="${cy}" r="${r}" fill="var(--surface-3)"/></svg>`;
  let angle = -90, paths = '';
  segments.forEach(s => {
    const frac = s.value / total;
    if(frac <= 0) return;
    const startAngle = angle, endAngle = angle + frac*360;
    const toXY = a => [cx + r*Math.cos(a*Math.PI/180), cy + r*Math.sin(a*Math.PI/180)];
    if(frac >= 0.9999){
      paths += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${s.color}"/>`;
    } else {
      const [x1,y1] = toXY(startAngle), [x2,y2] = toXY(endAngle);
      const large = (endAngle-startAngle) > 180 ? 1 : 0;
      paths += `<path d="M ${cx} ${cy} L ${x1.toFixed(2)} ${y1.toFixed(2)} A ${r} ${r} 0 ${large} 1 ${x2.toFixed(2)} ${y2.toFixed(2)} Z" fill="${s.color}"/>`;
    }
    angle = endAngle;
  });
  return `<svg viewBox="0 0 ${size} ${size}" style="width:${size}px; height:${size}px; flex-shrink:0;">${paths}</svg>`;
}

/** 1X2 prediction-distribution pie: how the group predicted the outcome
 *  (not the actual result) — shown once a game's bets are locked/revealed. */
function renderOneXTwoPie(g, bets){
  let winA=0, draw=0, winB=0;
  bets.forEach(b => {
    const a = +b.betA, bb = +b.betB;
    if(b.betA==null || b.betA==='' || b.betB==null || b.betB==='' || isNaN(a) || isNaN(bb)) return;
    if(a>bb) winA++; else if(a<bb) winB++; else draw++;
  });
  const total = winA+draw+winB;
  if(total===0) return '';
  const pct = n => Math.round((n/total)*100);
  const segs = [
    { label: teamName(g.teamA), tag:'1', value: winA, color:'#4c9a6a' },
    { label: t('drawShort'), tag:'X', value: draw, color:'#9aa69e' },
    { label: teamName(g.teamB), tag:'2', value: winB, color:'#e2564f' },
  ];
  return `
  <div class="card-title" style="margin-top:16px;">${t('oneXTwoTitle')}</div>
  <div style="display:flex; align-items:center; gap:16px; flex-wrap:wrap;">
    ${svgPieChart(segs, 104)}
    <div style="display:flex; flex-direction:column; gap:6px; font-size:12.5px; min-width:0;">
      ${segs.map(s => `<div style="display:flex; align-items:center; gap:6px;">
        <span style="display:inline-block; width:10px; height:10px; border-radius:3px; background:${s.color}; flex-shrink:0;"></span>
        <span>${s.label} (${s.tag}) — <span class="iso-num" style="font-weight:700;">${pct(s.value)}%</span> <span style="color:var(--text-faint);">(${s.value})</span></span>
      </div>`).join('')}
    </div>
  </div>`;
}
function resolveEventPlayerDisplay(ev){
  const p = findPlayer(ev.player);
  if(p) return { name: playerName(p), team: teamNameHTML(p.teamId) };
  return { name: ev.player, team: ev.team ? teamNameHTML(ev.team) : '' };
}

/** "Crowd consensus" pie for knockout games: what share of the group predicted
 *  each team to advance — shown once bets are locked/revealed, same as the 1X2 pie. */
function renderAdvancingConsensus(g, bets){
  if(!isKnockout(g)) return '';
  let pickA=0, pickB=0;
  bets.forEach(b => {
    if(b.betAdvancing===g.teamA) pickA++; else if(b.betAdvancing===g.teamB) pickB++;
  });
  const total = pickA+pickB;
  if(total===0) return '';
  const pct = n => Math.round((n/total)*100);
  const segs = [
    { label: teamName(g.teamA), value: pickA, color:'#4c9a6a' },
    { label: teamName(g.teamB), value: pickB, color:'#e2564f' },
  ];
  return `
  <div class="card-title" style="margin-top:16px;">${t('consensusAdvancingTitle')}</div>
  <div style="display:flex; align-items:center; gap:16px; flex-wrap:wrap;">

    <div style="display:flex; flex-direction:column; gap:6px; font-size:12.5px; min-width:0;">
      ${segs.map(s => `<div style="display:flex; align-items:center; gap:6px;">
        <span style="display:inline-block; width:10px; height:10px; border-radius:3px; background:${s.color}; flex-shrink:0;"></span>
        <span>${s.label} — <span class="iso-num" style="font-weight:700;">${pct(s.value)}%</span> <span style="color:var(--text-faint);">(${s.value})</span></span>
      </div>`).join('')}
    </div>
  </div>`;
}
/** Top 3 most-predicted "top player of the game" picks, with their share of the
 *  group's bets — a horizontal bar per pick, shown once bets are locked/revealed. */
function renderTopPlayerConsensus(bets){
  const counts = {};
  let total = 0;
  bets.forEach(b => {
    if(!b.betTopPlayer) return;
    counts[b.betTopPlayer] = (counts[b.betTopPlayer]||0) + 1;
    total++;
  });
  if(total===0) return '';
  const top = Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,3)
    .map(([playerId,n]) => ({ playerId, n, pct: Math.round((n/total)*100) }));
  return `
  <div class="card-title" style="margin-top:16px;">${t('consensusTopPlayerTitle')}</div>
  ${top.map(row => {
    const p = findPlayer(row.playerId);
    return `<div class="consensus-row">
      <div class="consensus-row-top"><span>${p ? playerName(p) : row.playerId}</span><span class="iso-num" style="font-weight:700;">${row.pct}%</span></div>
      <div class="consensus-bar-track"><div class="consensus-bar-fill" style="width:${row.pct}%;"></div></div>
    </div>`;
  }).join('')}`;
}
function eventBreakdownText(events){
  const labels = { goal:t('evGoal'), assist:t('evAssist'), ownGoal:t('evOwnGoal'), redCard:t('evRedCard'), missedPenalty:t('evMissedPenalty'), cleanSheet:t('evCleanSheet'), penaltySave:t('evPenaltySave') };
  const counts = {};
  events.forEach(ev => { counts[ev.eventType] = (counts[ev.eventType]||0) + (+ev.count || 1); });
  return Object.entries(counts).map(([k,n]) => `${n>1 ? n+'× ' : ''}${labels[k]||k}`).join(' · ');
}

function wireGamesForm(){
  document.querySelectorAll('[data-subtab]').forEach(btn => {

  });
  document.querySelectorAll('[data-filter]').forEach(btn => {

  });
  function syncDoubleCheckboxes(){
    const boxes = [...document.querySelectorAll('[data-role="double"]')];
    const activeChecked = boxes.find(cb => cb.checked && !cb.disabled);
    boxes.forEach(cb => {
      if(cb.dataset.savedLocked === '1') return; // permanently locked by already-saved data — leave alone
      const label = cb.closest('.double-label');
      if(activeChecked && cb !== activeChecked){
        cb.disabled = true;
        if(label) label.style.opacity = '.6';
      } else {
        cb.disabled = false;
        if(label) label.style.opacity = '';
      }
    });
  }
  document.querySelectorAll('[data-role="double"]').forEach(cb => cb.addEventListener('change', syncDoubleCheckboxes));
  syncDoubleCheckboxes();
  document.querySelectorAll('[data-role="saveGame"]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if(!STATE.user){ alert(t('emailFirst')); return; }
      if(!requireFreshSession()){ showToast('⚠️ ' + t('sessionExpired'), true); renderAll(); return; }
      const card = btn.closest('.game-card');
      const scoreAInput = card.querySelector('[data-role="scoreA"]');
      const scoreBInput = card.querySelector('[data-role="scoreB"]');
      const advSelect = card.querySelector('[data-role="advancing"]');
      const topPlayerSelect = card.querySelector('[data-role="topPlayer"]');
      const doubleCheckbox = card.querySelector('[data-role="double"]');
      if(scoreAInput.value==='' || scoreBInput.value===''){
        showToast('⚠️ ' + t('scoreRequired'), true);
        (scoreAInput.value===''? scoreAInput : scoreBInput).focus();
        return;
      }
      if(!topPlayerSelect || topPlayerSelect.value===''){
        showToast('⚠️ ' + t('topPlayerRequired'), true);
        if(topPlayerSelect) topPlayerSelect.focus();
        return;
      }
      const wantsDouble = doubleCheckbox && doubleCheckbox.checked;
      if(wantsDouble && myDoubleGameId() && myDoubleGameId() !== String(btn.dataset.id)){
        showToast('⚠️ ' + t('doubleUsedElsewhere'), true);
        return;
      }
      const payload = {
        type:'gameBet', email: STATE.user.email, gameId: btn.dataset.id,
        betA: scoreAInput.value,
        betB: scoreBInput.value,
        betTopPlayer: topPlayerSelect ? topPlayerSelect.value : '',
        betAdvancing: advSelect ? advSelect.value : '',
        betDouble: wantsDouble ? '1' : '',
        timestamp: new Date().toISOString(),
      };
      btn.textContent = '⏳'; btn.disabled = true;
      await postBet(payload);
      // Optimistic: assume the write succeeded and update the UI immediately.
      const optimisticRow = { email: STATE.user.email, ...payload };
      const applyOptimisticGameBet = () => {
        const idx = STATE.gameBets.findIndex(b => normEmail(b.email)===normEmail(STATE.user.email) && String(b.gameId)===String(payload.gameId));
        if(idx>=0) STATE.gameBets[idx] = {...STATE.gameBets[idx], ...optimisticRow};
        else STATE.gameBets.push(optimisticRow);
      };
      applyOptimisticGameBet();
      showToast('✅ ' + t('saved'));
      renderAll();
      // Quietly confirm in the background; only surface anything if it actually failed.
      pollUntilSaved('GameBets', 'gameBets', () =>
        STATE.gameBets.find(b => normEmail(b.email)===normEmail(STATE.user.email) && String(b.gameId)===String(payload.gameId)
          && String(b.betA)===String(payload.betA) && String(b.betB)===String(payload.betB)
          && isDoubleFlag(b.betDouble)===isDoubleFlag(payload.betDouble)),
        4, 1200, applyOptimisticGameBet
      ).then(landed => {
        if(!landed){ showToast('⚠️ ' + t('saveFailed'), true); loadAllData().then(renderAll); }
      });
    });
  });
  document.querySelectorAll('[data-role="exportGameBets"]').forEach(btn => {
    btn.addEventListener('click', () => exportElementImage(btn.dataset.target, btn.dataset.file, btn));
  });
}

let statsHiddenParticipants = new Set(); // by email — shared across both charts

function buildStatsSeries(){
  const ranked = rankedParticipants();
  const palette = ['#ffb020','#4c9a6a','#5b8fd6','#e2564f','#c9c9c9','#8a611c'];
  const series = ranked.map((p,pi) => {
    const form = (p.form||[]).map(v => +v || 0);
    let running = p.totalPoints - form.reduce((a,b) => a+b, 0); // points before the tracked recent games
    const values = [running, ...form.map(v => running += v)];
    return { name: p.displayName, email: p.email, color: palette[pi % palette.length], values };
  });
  const maxLen = Math.max(1, ...series.map(s => s.values.length));
  return { series, maxLen };
}

/** For each tracked point in time, ranks every participant against everyone
 *  else at that same point (competition ranking — ties share a rank). This
 *  is always computed from the FULL list regardless of what's hidden, since
 *  hiding a line shouldn't change what anyone's true standing was. */
function computeRankSeries(series, maxLen){
  const ranks = series.map(() => []);
  for(let i=0; i<maxLen; i++){
    const entries = series.map((s,idx) => ({idx, val: s.values[i]})).filter(e => e.val !== undefined);
    entries.sort((a,b) => b.val - a.val);
    let rank = 0, prevVal = null;
    entries.forEach((e,pos) => {
      if(e.val !== prevVal){ rank = pos+1; prevVal = e.val; }
      ranks[e.idx][i] = rank;
    });
  }
  return ranks;
}

function drawPointsChart(series, maxLen){
  const svg = document.getElementById('statsSvg'); if(!svg) return;
  const tooltip = document.getElementById('statsTooltip');
  const visible = series.filter(s => !statsHiddenParticipants.has(s.email));
  const W = 700, H = 320, padL = 42, padR = 14, padT = 14, padB = 30;
  const allValues = visible.flatMap(s => s.values);
  const minY = Math.min(0, ...(allValues.length ? allValues : [0]));
  const maxY = Math.max(1, ...(allValues.length ? allValues : [1]));
  const yRange = (maxY - minY) || 1;
  const x = i => padL + (maxLen<=1 ? 0 : i/(maxLen-1)) * (W-padL-padR);
  const y = v => H - padB - ((v - minY)/yRange) * (H-padT-padB);
  const isRTL = LANG==='he';

  let out = '';
  const yTicks = 4;
  for(let i=0; i<=yTicks; i++){
    const val = minY + (yRange * i/yTicks);
    const yy = y(val);
    out += `<line x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}" stroke="var(--border)" stroke-width="1"/>`;
    out += `<text x="${padL-8}" y="${yy+3.5}" font-size="10" fill="var(--text-faint)" text-anchor="${isRTL?'start':'end'}" font-family="var(--font-mono)">${Math.round(val)}</text>`;
  }
  for(let i=0; i<maxLen; i++){
    const xx = x(i);
    const label = i===0 ? t('statsStart') : String(i);
    out += `<text x="${xx}" y="${H-padB+16}" font-size="10" fill="var(--text-faint)" text-anchor="middle" font-family="var(--font-mono)">${label}</text>`;
  }
  out += `<text x="${(padL+W-padR)/2}" y="${H-4}" font-size="10" fill="var(--text-faint)" text-anchor="middle">${t('statsXAxis')}</text>`;

  visible.forEach(s => {
    const d = s.values.map((v,i) => `${i===0?'M':'L'} ${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
    out += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2"/>`;
    s.values.forEach((v,i) => {
      out += `<circle class="stats-point" cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="4" fill="${s.color}" stroke="var(--surface)" stroke-width="1.5" data-name="${s.name}" data-value="${v}" data-idx="${i}"/>`;
    });
  });
  svg.innerHTML = out;
  wireChartTooltips(svg, tooltip, pt => {
    const idx = +pt.dataset.idx;
    const label = idx===0 ? t('statsStart') : `${t('statsXAxis')} ${idx}`;
    return `${pt.dataset.name} — ${label}: ${pt.dataset.value} ${t('pointsShort')}`;
  });
}

function drawRankChart(series, maxLen){
  const svg = document.getElementById('rankSvg'); if(!svg) return;
  const tooltip = document.getElementById('rankTooltip');
  const ranks = computeRankSeries(series, maxLen); // true standings, unaffected by hidden lines
  const visible = series.map((s,idx) => ({s,idx})).filter(({s}) => !statsHiddenParticipants.has(s.email));
  const maxRank = series.length || 1;
  const W = 700, H = 320, padL = 42, padR = 14, padT = 14, padB = 30;
  const x = i => padL + (maxLen<=1 ? 0 : i/(maxLen-1)) * (W-padL-padR);
  const y = r => padT + ((r-1)/((maxRank-1)||1)) * (H-padT-padB); // rank 1 (best) at top
  const isRTL = LANG==='he';

  let out = '';
  for(let r=1; r<=maxRank; r++){
    const yy = y(r);
    out += `<line x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}" stroke="var(--border)" stroke-width="1"/>`;
    out += `<text x="${padL-8}" y="${yy+3.5}" font-size="10" fill="var(--text-faint)" text-anchor="${isRTL?'start':'end'}" font-family="var(--font-mono)">${r}</text>`;
  }
  for(let i=0; i<maxLen; i++){
    const xx = x(i);
    const label = i===0 ? t('statsStart') : String(i);
    out += `<text x="${xx}" y="${H-padB+16}" font-size="10" fill="var(--text-faint)" text-anchor="middle" font-family="var(--font-mono)">${label}</text>`;
  }
  out += `<text x="${(padL+W-padR)/2}" y="${H-4}" font-size="10" fill="var(--text-faint)" text-anchor="middle">${t('statsXAxis')}</text>`;

  visible.forEach(({s, idx}) => {
    const points = ranks[idx].map((r,i) => r!==undefined ? {i, r} : null).filter(Boolean);
    if(!points.length) return;
    const d = points.map((p,pi) => `${pi===0?'M':'L'} ${x(p.i).toFixed(1)} ${y(p.r).toFixed(1)}`).join(' ');
    out += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2"/>`;
    points.forEach(p => {
      out += `<circle class="stats-point" cx="${x(p.i).toFixed(1)}" cy="${y(p.r).toFixed(1)}" r="4" fill="${s.color}" stroke="var(--surface)" stroke-width="1.5" data-name="${s.name}" data-value="${p.r}" data-idx="${p.i}"/>`;
    });
  });
  svg.innerHTML = out;
  wireChartTooltips(svg, tooltip, pt => {
    const idx = +pt.dataset.idx;
    const label = idx===0 ? t('statsStart') : `${t('statsXAxis')} ${idx}`;
    return `${pt.dataset.name} — ${label}: #${pt.dataset.value}`;
  });
}

function renderStatsLegend(containerId, series){
  const el = document.getElementById(containerId); if(!el) return;
  el.innerHTML = series.map(s => {
    const hidden = statsHiddenParticipants.has(s.email);
    return `<div class="legend-item" data-legend-toggle="${s.email}" style="cursor:pointer; opacity:${hidden?.35:1}; text-decoration:${hidden?'line-through':'none'};">
      <span class="legend-swatch" style="background:${s.color}"></span>${s.name}
    </div>`;
  }).join('');
  el.querySelectorAll('[data-legend-toggle]').forEach(item => {
    item.addEventListener('click', () => {
      const email = item.dataset.legendToggle;
      if(statsHiddenParticipants.has(email)) statsHiddenParticipants.delete(email);
      else statsHiddenParticipants.add(email);
      drawStatsCharts();
    });
  });
}

function drawStatsCharts(){
  const { series, maxLen } = buildStatsSeries();
  drawPointsChart(series, maxLen);
  drawRankChart(series, maxLen);
  renderStatsLegend('statsLegend', series);
  renderStatsLegend('rankLegend', series);
}

/* ---- HALL OF FAME ---- */
function renderHof(){
  if(!STATE.hof.length){
    const msg = STATE.loaded ? t('noHof') : t('loading');
    return `<div class="section-title">${t('hofTitle')}</div><div class="card"><div class="empty-state">${STATE.loaded?'':'<div class="spinner"></div><br>'}${msg}</div></div>`;
  }
  return `
  <div class="section-title">${t('hofTitle')}</div>
  <div class="section-sub">${t('hofSub')}</div>
  <div class="card">
    ${STATE.hof.sort((a,b)=>b.year-a.year).map(h => {
      const winner = h['winnerName_'+LANG] || h.winnerName_en || h.winnerName_he;
      const runnerUp = h['runnerUp_'+LANG] || h.runnerUp_en || h.runnerUp_he;
      const champion = h['championTeam_'+LANG] || h.championTeam_en || h.championTeam_he;
      const location = h['location_'+LANG] || h.location_en || h.location_he;
      const rawType = String(h.tournamentType||'').trim();
      const isEuro = rawType.toLowerCase() === 'euro' || rawType === 'יורו';
      const typeLabel = isEuro ? t('euro') : t('worldcup');
      return `
      <div class="hof-item">
        <div class="hof-year iso-num">${h.year}</div>
        <div class="hof-trophy">🏆</div>
        <div>
          <div class="hof-name">${winner}</div>
          <div class="hof-sub">${typeLabel} · ${location} · ${t('hofChampionTeam')}: ${champion}</div>
          <div class="hof-sub">${t('runnerUpLabel')}: ${runnerUp}</div>
        </div>
      </div>`;
    }).join('')}
  </div>
  ${demoBanner()}`;
}

/* =========================================================
   ============  7. Auth (Google Sign-In)  ====================
   ========================================================= */
function initGoogleSignIn(){
  if(!window.google || !google.accounts){ setTimeout(initGoogleSignIn, 300); return; }
  google.accounts.id.initialize({
    client_id: '431204508277-nm33th0fs73s81cpn09ngmmalmbvgso1.apps.googleusercontent.com', // see SETUP.md
    callback: handleCredentialResponse,
  });
  renderAuthArea();
}
/** Decodes a JWT's payload (no signature check — Code.gs is the one that
 *  actually verifies the token; this is only used to read exp/profile fields). */
function decodeJwtPayload(idToken){
  try{ return JSON.parse(atob(idToken.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))); }catch{ return null; }
}
/** ID tokens only last ~1 hour. A stale one cached from a previous session
 *  would make Code.gs's verification silently reject every read/write, so
 *  treat it as "not signed in" up front instead of sending it. */
function isIdTokenExpired(idToken){
  const payload = idToken && decodeJwtPayload(idToken);
  return !payload || !payload.exp || (Date.now()/1000) >= (payload.exp - 30);
}
function clearExpiredSession(){
  STATE.user = null;
  localStorage.removeItem('md_user');
  renderAuthArea();
}
/** Bails out of a save early (before any optimistic UI update) if there's no
 *  signed-in user or their token has gone stale, instead of letting the
 *  server silently reject it later. Returns false and clears the session
 *  (showing the Sign-in button again) when the check fails. */
function requireFreshSession(){
  if(!STATE.user) return false;
  if(isIdTokenExpired(STATE.user.idToken)){ clearExpiredSession(); return false; }
  return true;
}
function handleCredentialResponse(resp){
  const payload = decodeJwtPayload(resp.credential);
  STATE.user = { email: payload.email, name: payload.name, picture: payload.picture, idToken: resp.credential };
  localStorage.setItem('md_user', JSON.stringify(STATE.user));
  renderAuthArea(); loadAllData().then(renderAll);
}
function signOut(){ STATE.user = null; localStorage.removeItem('md_user'); renderAuthArea(); loadAllData().then(renderAll); }
function renderAuthArea(){
  const wrap = document.getElementById('gsi-btn-wrap');
  if(STATE.user){
    wrap.innerHTML = `<div class="user-chip"><img src="${STATE.user.picture||''}" onerror="this.style.display='none'"><span class="name">${STATE.user.name}</span><span class="signout" id="signOutBtn" title="${t('signOut')}">⏻</span></div>`;
    document.getElementById('signOutBtn').onclick = signOut;
  } else {
    wrap.innerHTML = '';
    if(window.google && google.accounts) google.accounts.id.renderButton(wrap, { theme:'outline', size:'medium', text:'signin' });
  }
}

   ============  8. Boot  ======================================

document.getElementById('langToggle').onclick = () => {
  LANG = LANG==='en' ? 'he' : 'en';
  localStorage.setItem('md_lang', LANG);
  renderAll();
  if(document.getElementById('installBanner').style.display !== 'none') showInstallBanner();
};
document.getElementById('timerToggle').onclick = () => {
  SHOW_TIMER = !SHOW_TIMER;
  localStorage.setItem('md_showTimer', SHOW_TIMER ? '1' : '0');
  document.getElementById('timerToggle').classList.toggle('active', SHOW_TIMER);
  renderAll();
  tickCountdowns();
};
document.getElementById('themeToggle').onclick = () => {
  const html = document.documentElement;
  const next = html.getAttribute('data-theme')==='light' ? 'dark' : 'light';
  html.setAttribute('data-theme', next);
  localStorage.setItem('md_theme', next);
  document.getElementById('themeToggle').textContent = next==='light' ? '☀️' : '🌙';
};

/* ---- "Add to Home Screen" install prompt (Android/Chrome; iOS has no such
 *  API — those users still rely on the manual instructions in Tips). ---- */
let deferredInstallPrompt = null;
function isStandalone(){
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}
function showInstallBanner(){
  if(isStandalone() || localStorage.getItem('md_installDismissed')==='1') return;
  document.getElementById('installBannerText').textContent = t('installBannerText');
  document.getElementById('installBannerBtn').textContent = t('installBannerBtn');
  document.getElementById('installBannerClose').setAttribute('aria-label', t('installBannerCloseAria'));
  document.getElementById('installBanner').style.display = 'flex';
}
function hideInstallBanner(){ document.getElementById('installBanner').style.display = 'none'; }
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  showInstallBanner();
});
window.addEventListener('appinstalled', () => { deferredInstallPrompt = null; hideInstallBanner(); });
document.getElementById('installBannerBtn').onclick = async () => {
  if(!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
  hideInstallBanner();
};
document.getElementById('installBannerClose').onclick = () => {
  localStorage.setItem('md_installDismissed', '1');
  hideInstallBanner();
};

(function boot(){
  const savedTheme = localStorage.getItem('md_theme') || 'dark';
  if(savedTheme==='light') document.documentElement.setAttribute('data-theme','light');
  document.getElementById('themeToggle').textContent = savedTheme==='light' ? '☀️' : '🌙';
  document.getElementById('timerToggle').classList.toggle('active', SHOW_TIMER);
  const savedUser = localStorage.getItem('md_user');
  if(savedUser){
    const parsed = JSON.parse(savedUser);
    if(parsed && !isIdTokenExpired(parsed.idToken)) STATE.user = parsed;
    else localStorage.removeItem('md_user');
  }
  renderShell();
  document.getElementById('main').innerHTML = `<div class="card"><div class="empty-state"><div class="spinner"></div><br>${t('loading')}</div></div>`;
  initGoogleSignIn();
  loadAllData().then(() => { renderAll(); tickCountdowns(); });
})();
</script>
